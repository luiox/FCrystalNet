org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g

# toolchain
java_version=21

# Minecraft / Fabric: 1.21.11 is the last obfuscated release, yarn is frozen there,
# official Mojang mappings it is.
minecraft_version=1.21.11
loader_version=0.19.5
fabric_version=0.141.6+1.21.11
loom_version=1.13.6

# mod
mod_id=fcpoc

# JVM note: the embedded onnxruntime.dll binds to the MSVC redist bundled with
# whichever JVM runs it. Temurin 21 (msvcp140 14.40) is known-good; a corretto
# 21.0.4 host JVM (msvcp140 14.29) crashes ORT 1.31 with EXCEPTION_ACCESS_VIOLATION.
# :pocmod pins the test/runClient launcher to the ADOPTIUM vendor for exactly this -
# install Temurin 21 and the toolchain picks it up, no properties needed here.
